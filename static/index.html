<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kroniclez Live Digital TV Menu Board</title>
    
    <!-- High Performance Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/tv_menu.css?v=1">
</head>
<body>

    <!-- TV Sync Status Indicator -->
    <div class="tv-sync-status">
        <span class="pulse-dot"></span>
        <span id="tv-sync-time">TENDY LIVE SYNC</span>
    </div>

    <!-- Main Dynamic TV Menu Mount -->
    <main id="menuMount">
        <div style="text-align: center; padding: 80px 20px; color: #888; font-family: 'Plus Jakarta Sans', sans-serif;">
            <div style="font-size: 28px; font-weight: 800; color: #4CAF50; margin-bottom: 8px;">KRONICLEZ TV MENU</div>
            <div style="font-size: 13px; letter-spacing: 0.5px;">Connecting to Tendy POS Live Inventory Sync...</div>
        </div>
    </main>

    <!-- Floating TV Navigation Dock (Auto-hides on idle) -->
    <nav id="floatingNav" class="tv-floating-nav">
        <span style="font-size: 10px; font-weight: 900; color: #777; letter-spacing: 0.5px;">KRONICLEZ TV:</span>
        <button type="button" id="nav-btn-screen1" class="nav-link-btn" onclick="switchScreen(1)">
            <i class="bi bi-fire"></i> Pre-Rolls
        </button>
        <button type="button" id="nav-btn-screen2" class="nav-link-btn" onclick="switchScreen(2)">
            <i class="bi bi-flower1"></i> Vapes & Flower
        </button>
        <button type="button" id="nav-btn-screen3" class="nav-link-btn" onclick="switchScreen(3)">
            <i class="bi bi-cup-straw"></i> Soft Chews & Drinks
        </button>
        <button type="button" id="nav-btn-auto" class="nav-link-btn" onclick="toggleAutoCycle()" title="Toggle Auto-Cycle (30s rotation)">
            <i class="bi bi-arrow-repeat"></i> Auto
        </button>
        <button type="button" class="nav-link-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)">
            <i class="bi bi-fullscreen"></i>
        </button>
    </nav>

    <!-- Client Script -->
    <script src="/static/tv_menu.js?v=1"></script>
</body>
</html>
